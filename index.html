<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Lab · Диалоги</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#31252b,#0e121a 75%);color:#f1e6d7;font:19px/1.6 Georgia,serif}main{max-width:720px;margin:auto;padding:24px 16px 80px}.label{color:#c6a17b;font:12px system-ui;letter-spacing:.15em}h1{color:#e7ba88;margin:8px 0;font-size:clamp(28px,7vw,42px)}.panel{margin:20px 0;background:#1b2029;border:1px solid #80644c;border-radius:16px;padding:24px;min-height:340px}.who{font:700 15px system-ui;color:#e6b77f;margin-top:20px}.speech{font-size:clamp(20px,5vw,25px);min-height:145px;white-space:pre-wrap;margin:16px 0 22px}.meta{font:13px system-ui;color:#bdaea1}.btn{display:block;width:100%;text-align:left;border:1px solid #9a7956;background:#29313c;color:#fff1de;padding:15px;border-radius:9px;margin:8px 0;font:16px system-ui}.btn.primary{background:#75543d}.footer{display:flex;gap:10px}.footer .btn{width:50%}.progress{height:4px;background:#454044;border-radius:6px;margin:15px 0}.fill{height:100%;background:#d2a371}</style></head><body><main><div class="label">BETWEEN WORLDS · STORY LAB</div><h1>Бар между мирами</h1><div class="meta">Версия 0.2 · диалоги перед выбором · отдельная тестовая сборка</div><div class="progress"><div class="fill" id="fill"></div></div><div class="panel"><div class="meta" id="scene"></div><div class="who" id="who"></div><div class="speech" id="speech"></div><div id="actions"></div></div><div class="footer"><button class="btn" id="back">← Назад</button><button class="btn" id="reset">↻ Заново</button></div><p class="meta">Тестовый диалоговый маршрут. Полный 45-минутный сценарий и точные условия 50 концовок ещё не интегрированы. Основная игра не изменена.</p></main><script>const scenes=[["02:43 · Телефон","Рассказчик|Дождь хлещет по стёклам пустого бара.|Бармен|Снова последний гость? Уже закрыто.|Рассказчик|Телефон звонит, хотя провод давно выдернут.|Бармен|Если это доставка льда, вы опоздали лет на десять.","Ответить;Слушать молча;Отключить;Игнорировать","Голос: «Не верь тому, что помнишь».;Твой собственный голос: «Не отдавай монету».;Звонок продолжается даже без провода.;Принтер печатает: «Предупреждение отклонено»."],["02:51 · Третий стул","Рассказчик|Лампа над третьим стулом загорается сама.|Мира|Ты всё ещё протираешь один стакан?|Бармен|А вы всегда начинаете знакомство с претензий?|Мира|Значит, сегодня ты ничего не помнишь.|Рассказчик|Она кладёт монету с твоим именем.|Мира|В прошлый раз ты меня убил.","Поверить;Потребовать объяснений;Предложить напиток;Попросить уйти","Мира: «Спасибо, что хотя бы слушаешь».;Мира: «Ты держал меня за руку. Потом всё закончилось».;Мира: «Воду. И немного правды».;Мира: «От прошлого так просто не избавиться»."],["02:54 · Сдача","Рассказчик|На монете выгравированы твоё имя и сегодняшняя дата.|Бармен|Это какая-то очень дорогая сдача.|Мира|Её возвращают тем, кто ещё может отказаться.","Изучить;Вернуть Мире;Спрятать;Разбить","Под гравировкой проступает дата исчезновения.;Мира: «Она никогда не была моей».;Монета обжигает карман.;Вместо монеты трескается зеркало."],["02:57 · Чек","Рассказчик|Чековый принтер просыпается без команды.|Бармен|Кассу я закрывал. Точно помню.|Рассказчик|На бумаге: «Одна спасённая жизнь. Одна неоплаченная».|Мира|Не подписывай то, чего не понимаешь.","Сохранить;Сжечь;Показать Мире;Оспорить","На обратной стороне: «СВИДЕТЕЛЬ».;Принтер тут же выдаёт копию.;Мира: «Раньше там было моё имя».;Принтер впервые за ночь замолкает."],["03:00 · Коллектор","Рассказчик|Мужчина в сером пальто сидит у окна. Никто не видел, как он вошёл.|Коллектор|Я пришёл закрыть старый счёт.|Бармен|А представиться?|Коллектор|Можете звать меня Коллектором.|Мира|Попроси его показать договор.","Потребовать договор;Отдать монету;Стать хозяином;Отказаться","Внизу договора нет подписи Коллектора.;Коллектор: «Счёт уменьшился. Цена — нет».;Коллектор: «Хозяин всегда остаётся».;Коллектор: «Отказ тоже имеет цену»."],["03:03 · Гость без отражения","Рассказчик|Входит человек, которого не видно в зеркале.|Гость|Можно воды? Я слишком долго не чувствовал вкуса.|Бармен|Обычную или из другого мира?|Гость|Обычную. Здесь это редкость.","Дать воды;Потребовать плату;Выгнать;Спросить о пожаре","Гость: «В пожаре дверь закрыли снаружи».;Гость: «Мне больше нечем платить».;Его тень остаётся на стуле.;Гость: «В огне остались двое»."],["03:06 · Ева","Рассказчик|Вошедшая женщина пахнет дымом и дождём.|Ева|Я была там. В ночь пожара.|Бармен|Неужели никто не может просто заказать пиво?|Ева|Я видела, кто вышел. И кто остался.","Выслушать;Обвинить;Защитить;Попросить фото","Ева рассказывает о двух силуэтах в огне.;Ева: «Я тоже хотела забыть».;Коллектор отступает от свидетельницы.;На фото два бармена с одним лицом."],["03:09 · Две смены","Рассказчик|За стойкой стоит другой ты. Его рука обожжена.|Другой бармен|В моей ночи ты не спас её.|Бармен|Я не помню тебя.|Другой бармен|Не помнить того, кто остался в огне, удобно.|Мира|Никто из вас не обязан исчезать.","Выслушать;Обвинить;Объединиться;Напасть","Другой бармен: «Признай хотя бы, что я существую».;Другой бармен: «Ты снова ищешь виновного».;В зеркале отражаетесь оба.;Другой бармен: «Именно поэтому всё повторяется»."],["03:11 · Архив","Рассказчик|Под кассой лежат чеки из сотен прожитых ночей.|Бармен|Сколько же смен я пропустил?|Мира|Ни одной. Ты просто их забыл.|Коллектор|Архив принадлежит заведению.","Прочитать;Уничтожить;Раздать свидетелям;Спрятать","Ты узнаёшь о просьбе Миры остановить цикл.;Пепел пахнет той самой ночью.;Теперь правду хранят несколько человек.;Мира: «Ты опять решаешь один?»"],["03:13 · Просьба Миры","Мира|Однажды я сама попросила тебя убить меня.|Рассказчик|В баре стихает даже дождь.|Бармен|И ты считаешь, это оправдание?|Мира|Нет. Это была моя просьба и твой выбор. Мы оба ошибались.|Мира|Сегодня я прошу лишь услышать меня.","Попросить прощения;Отказаться повторять;Пообещать повторить;Дать ей выбрать","Мира: «Не знаю, смогу ли простить».;Мира: «Значит, мы можем измениться».;Мира: «Ты снова не услышал меня».;Мира: «Тогда выбери, кем будешь ты»."],["03:15 · Звонок","Рассказчик|Телефон снова звонит. Часы показывают 03:15.|Голос|Ты уже слышал меня.|Бармен|Если ты я из будущего, скажи хотя бы, что завтра выходной.|Голос|Завтра зависит от того, признаешь ли ты чужую жизнь.","Остановить часы;Собрать свидетелей;Освободить гостей;Ответить голосу","Стрелки застывают, но время продолжается.;Все свидетели подходят к стойке.;Дверь открывается без разрешения Коллектора.;Голос: «Не подписывай чужую неизбежность»."],["03:17 · Сверка","Рассказчик|Часы останавливаются на 03:17.|Коллектор|Осталось выбрать действительную версию.|Бармен|А кто решил, что верной может быть только одна?|Мира|Мы можем отказаться от правил.|Рассказчик|Монета, чек и договор лежат на стойке.","Оспорить сверку;Спасти Миру;Принять долг;Отказаться от всех сделок","Ты отодвигаешь чек: «Докажите, что я соглашался».;Ты протягиваешь Мире руку.;Коллектор достаёт ручку, но медлит.;Ты закрываешь книгу долгов."]],titles=["Последний заказ","Два бокала","Забудь меня","Тот самый танец","Счёт на двоих","Не в этот раз","Чужая любовь","Никогда не встречались","Одна минута вечности","Письмо на рассвете","Оплачено кровью","Пустая стойка","Неправильный убийца","Седьмой звонок","Место для одного","За закрытой дверью","Три семнадцать","Никто не виноват","Человек без лица","Пепел и янтарь","Новый хозяин","Смена без конца","Пятьдесят первый гость","Идеальный бармен","Последний чек","Инвентаризация душ","Бар на краю света","Открыто круглосуточно","Двойная смена","Последний посетитель","Монета решает","Свидетель","Протокол 03:17","Первая ночь","Подмена","Договор без подписи","Чужая дата","Голос в трубке","Обратная сторона","Невозможный свидетель","Не обслуживаем судьбу","Свобода стоит дорого","Пусть выбирают сами","Никаких больше убийств","Последний человек","Разбитые часы","Право на ошибку","Мир без бара","Ты уже играл","Закрыть навсегда"];const data=scenes.map(s=>({name:s[0],lines:s[1].split('|'),opts:s[2].split(';'),replies:s[3].split(';')}));let st;try{st=JSON.parse(localStorage.getItem('bw_lab_v02')||'null')}catch(e){}if(!st||!Number.isInteger(st.s)||!Array.isArray(st.c))st={s:0,l:0,phase:'lines',c:[]};const $=x=>document.getElementById(x);function save(){localStorage.setItem('bw_lab_v02',JSON.stringify(st))}function btn(t,f,primary){let b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=t;b.onclick=f;$('actions').append(b)}function draw(){save();$('actions').replaceChildren();$('fill').style.width=(Math.min(1,st.s/data.length)*100)+'%';if(st.s>=data.length){let h=0;st.c.forEach((v,i)=>h=(h*31+v*7+i*13)>>>0);let n=h%50;$('scene').textContent='Завершение тестового маршрута';$('who').textContent='Финал '+String(n+1).padStart(2,'0');$('speech').textContent=titles[n]+'\n\nПолный эпилог будет добавлен на следующем этапе.';return}let s=data[st.s];$('scene').textContent='Сцена '+(st.s+1)+' / '+data.length+' · '+s.name;if(st.phase==='reply'){$('who').textContent='Последствие';$('speech').textContent=s.replies[st.c[st.s]];btn('Продолжить →',()=>{st.s++;st.l=0;st.phase='lines';draw()},true)}else if(st.l<s.lines.length/2){$('who').textContent=s.lines[st.l*2];$('speech').textContent=s.lines[st.l*2+1];btn('Далее →',()=>{st.l++;draw()},true)}else{$('who').textContent='Твой выбор';$('speech').textContent='Как поступишь?';s.opts.forEach((o,i)=>btn(o,()=>{st.c[st.s]=i;st.phase='reply';draw()},false))}}$('back').onclick=()=>{if(st.s>=data.length){st.s=data.length-1;st.phase='reply'}else if(st.phase==='reply'){st.phase='lines';st.l=data[st.s].lines.length/2;st.c.pop()}else if(st.l>0){st.l--}else if(st.s>0){st.s--;st.phase='lines';st.l=data[st.s].lines.length/2}draw()};$('reset').onclick=()=>{if(confirm('Начать заново?')){st={s:0,l:0,phase:'lines',c:[]};draw()}};draw();</script></body></html>
