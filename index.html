<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Between Worlds — Story Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#10141b;color:#f1e3d0;font:18px/1.6 Georgia,serif}main{max-width:750px;margin:auto;padding:30px 18px 100px}h1,h2{color:#d6a46d}button{width:100%;padding:15px;margin:7px 0;background:#222d39;border:1px solid #97724c;border-radius:9px;color:#fff0da;text-align:left;font:16px system-ui;cursor:pointer}button:hover{background:#3c3540}p{white-space:pre-line}.muted{color:#c2a88c;font:13px system-ui}.panel{background:#19212ccc;border:1px solid #806347;border-radius:16px;padding:22px}#status{margin:16px 0}a{color:#f5c48b}</style></head><body><main><div class="muted">ОТДЕЛЬНЫЙ ТЕСТОВЫЙ ПРОЕКТ · НЕ ОСНОВНАЯ ИГРА</div><h1>Бар между мирами</h1><p class="muted">Story Lab · тестовая схема выборов · не финальный 45-минутный сценарий</p><div class="panel"><div id="status"></div><h2 id="heading"></h2><p id="story"></p><div id="choices"></div></div><button id="reset">Начать заново</button><p class="muted">Прогресс хранится только в этом браузере. Финалы в этой технической версии назначаются по комбинации решений; полные литературные эпилоги будут добавлены отдельно.</p></main><script>const stages=[["02:43 · Звонок","Старый телефон звонит в пустом баре. На экране — твоё собственное имя.",["Ответить","Не брать трубку","Слушать молча","Отключить телефон"]],["02:51 · Мира","Девушка в мокром пальто кладёт на стойку монету с твоим именем. «В прошлый раз ты меня убил».",["Поверить Мире","Потребовать доказательств","Обвинить её","Спросить о монете"]],["02:53 · Монета","Дата на монете меняется, когда ты отводишь взгляд.",["Спрятать","Вернуть Мире","Изучить","Бросить на пол"]],["02:56 · Чек","Принтер печатает заказ, который ещё не сделали.",["Прочитать","Порвать","Сохранить","Показать Мире"]],["03:00 · Заказ","Мира просит напиток, которого нет в меню. «Добавь правды».",["Приготовить","Отказать","Изменить рецепт","Спросить о прошлом"]],["03:04 · Коллектор","Человек в сером пальто предъявляет счёт за чужие жизни.",["Заплатить","Торговаться","Отказать","Потребовать договор"]],["03:07 · Чужой долг","В книге долгов записано имя другого бармена — твоё.",["Принять долг","Передать долг","Оспорить запись","Скрыть страницу"]],["03:09 · Без отражения","Посетитель стоит перед зеркалом, но в нём никого нет.",["Помочь","Выгнать","Заключить сделку","Выслушать"]],["03:11 · Свидетельница","Женщина в пальто помнит сразу две версии одной ночи.",["Выслушать","Обвинить","Защитить","Попросить показать прошлое"]],["03:13 · Другой бармен","За стойкой появляется человек с твоим лицом.",["Довериться","Обмануть","Напасть","Объединиться"]],["03:15 · Архив","На чеках записаны сотни ночей, которых ты не помнишь.",["Собрать доказательства","Скрыть","Уничтожить","Прочитать вслух"]],["03:17 · Выбор","Часы остановились. Мира ждёт ответа, который меняет не только её судьбу.",["Вмешаться","Наблюдать","Заменить участника","Остановить время"]],["Закрытие смены","Коллектор кладёт последний счёт на стойку. Дверь открыта в десятки миров.",["Оплатить","Отказаться","Разделить долг","Освободить всех"]]];const endings=["Последний заказ","Два бокала","Забудь меня","Тот самый танец","Счёт на двоих","Не в этот раз","Чужая любовь","Никогда не встречались","Одна минута вечности","Письмо на рассвете","Оплачено кровью","Пустая стойка","Неправильный убийца","Седьмой звонок","Место для одного","За закрытой дверью","Три семнадцать","Никто не виноват","Человек без лица","Пепел и янтарь","Новый хозяин","Смена без конца","Пятьдесят первый гость","Идеальный бармен","Последний чек","Инвентаризация душ","Бар на краю света","Открыто круглосуточно","Двойная смена","Последний посетитель","Монета решает","Свидетель","Протокол 03:17","Первая ночь","Подмена","Договор без подписи","Чужая дата","Голос в трубке","Обратная сторона","Невозможный свидетель","Не обслуживаем судьбу","Свобода стоит дорого","Пусть выбирают сами","Никаких больше убийств","Последний человек","Разбитые часы","Право на ошибку","Мир без бара","Ты уже играл","Закрыть навсегда"];let state;try{state=JSON.parse(localStorage.getItem('storylab_progress')||'null')}catch(e){}if(!state||!Number.isInteger(state.step)||!Array.isArray(state.history))state={step:0,history:[]};function render(){document.getElementById('status').textContent=state.step>=stages.length?'Конец маршрута':('Сцена '+(state.step+1)+' / '+stages.length);const c=document.getElementById('choices');c.replaceChildren();if(state.step>=stages.length){let hash=0;for(let i=0;i<state.history.length;i++)hash=(hash*31+state.history[i]*7+i*13)>>>0;let id=hash%50;document.getElementById('heading').textContent='Финал '+String(id+1).padStart(2,'0')+': '+endings[id];document.getElementById('story').textContent='Пробный маршрут завершён. Выборы: '+state.history.map((v,i)=>stages[i][2][v]).join(' → ')+'.';return;}let s=stages[state.step];document.getElementById('heading').textContent=s[0];document.getElementById('story').textContent=s[1];s[2].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{state.history.push(i);state.step++;localStorage.setItem('storylab_progress',JSON.stringify(state));render()};c.append(b)})}document.getElementById('reset').onclick=()=>{state={step:0,history:[]};localStorage.removeItem('storylab_progress');render()};render();</script></body></html>
